<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1B1140"/>

  <!-- slide de tras -->
  <g transform="rotate(-14 256 256)">
    <rect x="141" y="176" width="230" height="160" rx="26" fill="#4C3DFF"/>
  </g>

  <!-- folga entre a camada de tras e a do meio -->
  <g transform="rotate(-3 256 256)">
    <rect x="134" y="169" width="244" height="174" rx="32" fill="#1B1140"/>
  </g>

  <!-- slide do meio -->
  <g transform="rotate(-3 256 256)">
    <rect x="141" y="176" width="230" height="160" rx="26" fill="#17D7C0"/>
  </g>

  <!-- folga entre a camada do meio e a da frente -->
  <g transform="rotate(9 256 256)">
    <rect x="134" y="169" width="244" height="174" rx="32" fill="#1B1140"/>
  </g>

  <!-- slide da frente, com a seta de avancar -->
  <g transform="rotate(9 256 256)">
    <rect x="141" y="176" width="230" height="160" rx="26" fill="#FFF6E8"/>
    <path d="M214 214 L214 298 L290 256 Z" fill="#FF7A29" stroke="#FF7A29" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
