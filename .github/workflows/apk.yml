name: Gerar APK do Imago

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). O passo
      # android-actions/setup-android@v3 quebrava ao pedir o pacote "tools",
      # que não existe mais; aqui só aceitamos as licenças.
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # Falha cedo (antes dos ~5 min de build) se a lógica de segurança/atualização quebrar.
      - name: Rodar os testes
        run: npm test

      - name: Sincronizar o app web com o Android
        run: npm run sync

      - name: Preparar assinatura Android privada
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imago-release.keystore"
          test -s "$RUNNER_TEMP/imago-release.keystore"

      - name: Avisar sobre APK de teste sem assinatura de publicação
        if: ${{ env.HAS_ANDROID_SIGNING != 'true' }}
        run: |
          echo "Secrets Android ausentes: será gerado somente um APK debug para teste; a Release apk-latest não será atualizada."

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/imago-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Guardar o APK
        run: |
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Imago.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk Imago-debug-test.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Imago-apk
          path: Imago*.apk

      # Link fixo de download: https://github.com/<usuario>/<repo>/releases/download/apk-latest/Imago.apk
      - name: Publicar o APK na Release "apk-latest"
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Imago.apk \
            --title "Imago (APK Android)" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o Imago.apk no celular e instale."

      - name: Informar que a Release pública foi bloqueada sem assinatura
        if: ${{ env.HAS_ANDROID_SIGNING != 'true' }}
        run: echo "APK debug de teste gerado como artefato. Configure os quatro secrets Android para publicar apk-latest e permitir atualizações sem desinstalar."
