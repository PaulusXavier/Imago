name: Gerar APK do Imago

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). O passo
      # android-actions/setup-android@v3 quebrava ao pedir o pacote "tools",
      # que não existe mais; aqui só aceitamos as licenças.
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # Falha cedo (antes dos ~5 min de build) se a lógica de segurança/atualização quebrar.
      - name: Rodar os testes
        run: npm test

      - name: Sincronizar o app web com o Android
        run: npm run sync

      - name: Preparar assinatura Android privada
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Configure os secrets Android antes de publicar um APK." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imago-release.keystore"
          test -s "$RUNNER_TEMP/imago-release.keystore"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/imago-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar o APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Imago.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Imago-apk
          path: Imago.apk

      # Link fixo de download: https://github.com/<usuario>/<repo>/releases/download/apk-latest/Imago.apk
      - name: Publicar o APK na Release "apk-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Imago.apk \
            --title "Imago (APK Android)" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o Imago.apk no celular e instale."
