name: Gerar APK do Imago

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME). O passo
      # android-actions/setup-android@v3 quebrava ao pedir o pacote "tools",
      # que não existe mais; aqui só aceitamos as licenças.
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # Falha cedo (antes dos ~5 min de build) se a lógica de segurança/atualização quebrar.
      - name: Rodar os testes
        run: npm test

      - name: Sincronizar o app web com o Android
        run: npm run sync

      # Confere se cada build.gradle/AndroidManifest esta na pasta certa. Ha DOIS
      # build.gradle (android/ e android/app/) e DOIS AndroidManifest.xml: trocar um
      # pelo outro ao enviar os arquivos gera o erro confuso "Plugin with id
      # 'com.android.application' not found". Aqui ele vira uma mensagem clara.
      - name: Conferir a estrutura do projeto Android
        run: |
          fail() { echo "::error::$1"; exit 1; }
          grep -q "com.android.tools.build:gradle" android/build.gradle \
            || fail "android/build.gradle esta errado: deveria ter o buildscript com o plugin do Android (parece ter sido trocado pelo android/app/build.gradle)."
          grep -q "com.android.application" android/app/build.gradle \
            || fail "android/app/build.gradle esta errado: deveria comecar com apply plugin 'com.android.application' (parece ter sido trocado pelo android/build.gradle)."
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml \
            || fail "android/app/src/main/AndroidManifest.xml esta errado ou ausente."
          if [ -f apk.yml ]; then echo "::warning::Existe um apk.yml solto na raiz do repositorio; apague-o (o certo fica em .github/workflows/)."; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Imago.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Imago-apk
          path: Imago.apk

      # Link fixo de download: https://github.com/<usuario>/<repo>/releases/download/apk-latest/Imago.apk
      - name: Publicar o APK na Release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Imago.apk \
            --title "Imago (APK Android)" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o Imago.apk no celular e instale."
